name: Release

# Publishing is gated on a tag you push deliberately:
#
#   npm version minor && git push --follow-tags
#
# Required repository secrets:
#   VSCE_PAT  — Azure DevOps personal access token with Marketplace > Manage
#   OVSX_PAT  — Open VSX access token (optional; skipped when unset)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm run check-types
      - run: npm run lint
      - run: node esbuild.mjs --production

      - name: Package
        run: npx vsce package --out "claude-autocommit-${GITHUB_REF_NAME#v}.vsix"

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "claude-autocommit-${GITHUB_REF_NAME#v}.vsix"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "claude-autocommit-${GITHUB_REF_NAME#v}.vsix" -p "$OVSX_PAT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "claude-autocommit-${GITHUB_REF_NAME#v}.vsix" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/sudsarkar13/claude-autocommit/blob/main/CHANGELOG.md)."
