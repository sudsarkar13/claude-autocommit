name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Build
        run: node esbuild.mjs --production

      - name: Package
        run: npx vsce package --out claude-autocommit.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: claude-autocommit-vsix
          path: claude-autocommit.vsix
